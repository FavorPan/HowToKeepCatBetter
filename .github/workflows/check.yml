name: check

# 内容质检。站点就是仓库根目录（index.html 直读 book/），Pages 走分支发布，
# 所以这里只查不发布：条目格式、README 统计、站点解析一致性。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  stats:
    name: 条目格式检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_stats.py
      - run: python3 tools/stats.py --check

  site:
    name: 站点解析检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test_site.mjs
